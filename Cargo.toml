[package]
name = "starail"
version = "0.1.0"
edition = "2021"
description = "A small Linux terminal client for managing a local mihomo core."
license = "MIT"

[dependencies]
anyhow = "1"
clap = { version = "4.5", features = ["derive"] }
crossterm = "0.27"
flate2 = "1"
libc = "0.2"
ratatui = "0.26"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
unicode-width = "0.1"
urlencoding = "2"

[profile.release]
lto = true
strip = true
codegen-units = 1
